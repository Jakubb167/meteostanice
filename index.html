<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meteostanice – Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@2.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@1.2.1/dist/chartjs-plugin-zoom.min.js"></script>
<style>
:root{--bg:#eef2f6;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--soft:#f6f8fb;--accent:#3b5bdb;--accent-soft:rgba(59,91,219,.1);--shadow:0 1px 2px rgba(15,23,42,.05),0 6px 20px rgba(15,23,42,.04);color-scheme:light dark}
body.sklenik{--accent:#15803d;--accent-soft:rgba(21,128,61,.1)}
@media(prefers-color-scheme:dark){:root{--bg:#0a101d;--card:#121a2c;--text:#e6eaf2;--muted:#8d9bb5;--line:#232f4a;--soft:#0e1626;--accent:#7b93ff;--accent-soft:rgba(123,147,255,.14);--shadow:0 1px 2px rgba(0,0,0,.4)}body.sklenik{--accent:#4ade80;--accent-soft:rgba(74,222,128,.13)}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.45;padding:16px;transition:background .4s}
.wrap{max-width:1640px;margin:0 auto}
header{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:22px 26px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;border-left:6px solid var(--accent)}
h1{font-size:1.7rem;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);margin-top:2px}
.src{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.src button{border:0;background:none;color:var(--muted);font:600 .95rem inherit;font-family:inherit;padding:9px 18px;border-radius:9px;cursor:pointer}
.src button.on{background:var(--accent);color:#fff}
.src button:not(.on):hover{color:var(--text)}
.live{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:.85rem;margin-top:8px}
.live i{width:9px;height:9px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:p 2s infinite}
@keyframes p{70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
#msg{margin:16px 0;padding:14px 18px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);text-align:center;color:var(--muted)}
#msg.bad{background:#dc2626;color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin:16px 0}
.stat{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:16px 18px;border-top:4px solid var(--c)}
.sh{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:.85rem;font-weight:600}
.sv{font-size:2.4rem;font-weight:700;line-height:1.1;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.sv small{font-size:1rem;font-weight:500;color:var(--muted);margin-left:4px}
.st{font-size:.85rem;font-weight:600}.st.up{color:#16a34a}.st.dn{color:#dc2626}
.sm{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);display:grid;gap:3px;font-size:.82rem;color:var(--muted)}
.sm b{color:var(--text);font-weight:600;margin-right:4px}.sm em{font-style:normal;margin-left:6px;opacity:.75}
.tabs{position:sticky;top:0;z-index:20;display:flex;gap:6px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:6px;margin-bottom:16px;overflow-x:auto}
.tab{flex:1;white-space:nowrap;border:0;background:none;color:var(--muted);font:600 .95rem inherit;font-family:inherit;padding:11px 18px;border-radius:10px;cursor:pointer}
.tab:hover{background:var(--soft)}.tab.on{background:var(--accent);color:#fff}
.pane{display:none}.pane.on{display:block}
.filters{display:flex;flex-wrap:wrap;gap:14px;align-items:end;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:14px 18px;margin-bottom:16px}
.filters label,.cmp label{display:grid;gap:4px;font-size:.78rem;font-weight:600;color:var(--muted)}
select,input{font:inherit;font-size:.92rem;color:var(--text);background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.btn,.ghost{font:600 .85rem inherit;font-family:inherit;border-radius:8px;cursor:pointer}
.btn{background:var(--accent);color:#fff;border:0;padding:10px 16px}
.ghost{background:none;border:1px solid var(--line);color:var(--muted);padding:6px 10px}.ghost:hover{color:var(--text);border-color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:12px 16px}
.kpi span{display:block;font-size:.78rem;color:var(--muted);font-weight:600}
.kpi b{font-size:1.45rem;font-variant-numeric:tabular-nums}.kpi em{display:block;font-style:normal;font-size:.78rem;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:16px;margin-bottom:16px}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:20px 22px;min-width:0}
.wide{grid-column:1/-1}
.ch{display:flex;justify-content:space-between;gap:12px;align-items:start;margin-bottom:12px;flex-wrap:wrap}
.card h2{font-size:1.1rem;font-weight:700}.card p{color:var(--muted);font-size:.85rem;margin-top:2px}
.cw{position:relative;height:320px}.wide .cw{height:400px}
.cmp{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.badge{font-size:.8rem;font-weight:600;padding:5px 12px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.tbl{overflow:auto;max-height:520px;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:.88rem;font-variant-numeric:tabular-nums}
th,td{padding:8px 12px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{position:sticky;background:var(--soft);color:var(--muted);font-size:.78rem;font-weight:600;border-bottom:1px solid var(--line)}
thead tr:first-child th{top:0;text-align:center}thead tr:nth-child(2) th{top:33px}
thead tr:first-child th:first-child{text-align:left}
tbody tr:nth-child(even){background:var(--soft)}tbody tr:hover{background:var(--accent-soft)}
td.hot{color:#dc2626;font-weight:600}td.cold{color:#2563eb;font-weight:600}
.hgrid{display:grid;grid-template-columns:50px 1fr;width:100%}
.hy{display:flex;flex-direction:column;padding-top:30px}
.hyl{font-size:.7rem;color:var(--muted);text-align:right;padding-right:8px;height:20px;line-height:20px}
.hxl{position:relative;height:30px;border-bottom:1px solid var(--line)}
.hml{position:absolute;top:8px;font-size:.75rem;font-weight:600;color:var(--muted);transform:translateX(-50%)}
.hdata{display:flex}
.hcol{display:flex;flex-direction:column;flex:1;min-width:2px}
.hc{height:20px;cursor:pointer;transition:transform .15s}
.hc:hover{transform:scale(1.5);z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.4);border:2px solid #fff;position:relative}
.hl{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:.82rem;color:var(--muted)}
.hl i{flex:1;height:12px;border-radius:6px}
body.sklenik .meteo-only{display:none!important}body:not(.sklenik) .sk-only{display:none!important}
.ml{margin-left:auto;display:flex;gap:8px;align-items:center}
.alert{padding:11px 16px;border-radius:12px;font-weight:600;margin-top:12px;background:#fee2e2;color:#991b1b}.alert.warn{background:#fef3c7;color:#92400e}
.thr{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:.8rem;color:var(--muted);margin-top:12px}.thr label{display:flex;gap:6px;align-items:center}.thr input{width:70px;padding:5px 8px}
@media(max-width:700px){body{padding:10px}h1{font-size:1.35rem}.sv{font-size:2rem}.cw,.wide .cw{height:290px}.card{padding:16px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1 id="title">⛅ Meteostanice</h1>
    <div class="sub" id="subtitle">Sázava – Černé Budy</div>
    <div class="live"><i></i><span id="last">Načítám…</span></div>
  </div>
  <div class="src">
    <button id="bm" class="on" onclick="switchSource('meteostanice')">⛅ Meteostanice</button>
    <button id="bs" onclick="switchSource('sklenik')">🌿 Skleník</button>
  </div>
</header>
<div id="msg">⏳ Načítám data…</div>
<div id="app" style="display:none">
  <div id="alerts"></div>
  <div class="thr"><b>Prahy:</b><label>Mráz ≤<input id="thFrost" type="number" step="0.5" value="3" onchange="setTh()">°C</label><label class="sk-only">Horko ≥<input id="thHot" type="number" value="30" onchange="setTh()">°C</label><label class="sk-only">Chlad ≤<input id="thCold" type="number" value="5" onchange="setTh()">°C</label></div>
  <div class="stats" id="stats"></div>
  <nav class="tabs">
    <button class="tab on" onclick="switchTab('c')">📊 Aktuálně</button>
    <button class="tab" onclick="switchTab('d')">📅 Denní</button>
    <button class="tab" onclick="switchTab('m')">📆 Měsíční</button>
    <button class="tab" onclick="switchTab('y')">📋 Roční</button>
  </nav>
  <section class="pane on" id="pane-c"></section>
  <section class="pane" id="pane-d"></section>
  <section class="pane" id="pane-m"></section>
  <section class="pane" id="pane-y"></section>
</div>
</div>

<script>
const API='https://meteosazava.baborovsky-jakub.workers.dev/';
const REFRESH=15*60*1000;
const $=id=>document.getElementById(id);
const css=v=>getComputedStyle(document.body).getPropertyValue(v).trim();
const f=(v,d=1)=>(v==null||isNaN(v))?'–':v.toFixed(d).replace('.',',');
const fd=(d,o)=>d.toLocaleString('cs-CZ',o);
const DT={day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'};
const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
const mn=a=>a.reduce((x,y)=>y<x?y:x,Infinity);
const mx=a=>a.reduce((x,y)=>y>x?y:x,-Infinity);
const MON=['leden','únor','březen','duben','květen','červen','červenec','srpen','září','říjen','listopad','prosinec'];
const M3=['led','úno','bře','dub','kvě','čvn','čvc','srp','zář','říj','lis','pro'];
const kp=(t,v,s)=>`<div class="kpi"><span>${t}</span><b>${v}</b>${s?`<em>${s}</em>`:''}</div>`;
const dew=(T,H)=>{if(H<=0)return T;const g=Math.log(H/100)+17.62*T/(243.12+T);return 243.12*g/(17.62-g);};
const COL={T:'#ef4444',H:'#3b82f6',P:'#f59e0b',B:'#10b981',R:'#0ea5e9',RB:'#8b5cf6',A:'#6366f1',G:'#16a34a'};

Chart.defaults.font.family="'IBM Plex Sans','Segoe UI',system-ui,sans-serif";
Chart.defaults.color=css('--muted');
Chart.defaults.borderColor=css('--line');

const CFG={
  meteostanice:{title:'⛅ Meteostanice',sub:'Sázava – Černé Budy',p:true,r:true,batt:'Napětí baterie meteostanice'},
  sklenik:{title:'🌿 Skleník',sub:'Data ze skleníku',p:false,r:false,batt:'Napětí baterie skleníku'}
};
let source='meteostanice',tab='c',raw=[],charts={},dailyRows=[];
const TH={frost:3,hot:30,cold:5};
const store={meteostanice:null,sklenik:null},errs={};

/* ---------- načítání ---------- */
function parse(rows,sk){
  return rows.map(r=>{
    const t=new Date(r.datetime||r.datum_a_cas); if(isNaN(t))return null;
    const n=k=>parseFloat(r[k])||0,T=n('teplota'),H=n('vlhkost');
    return {t,T,H,D:dew(T,H),P:sk?0:n('tlak'),B:sk?(parseFloat(r.napeti||r.baterie)||0):n('baterie'),R:sk?0:n('srazky'),RB:sk?0:n('baterieSrazkomeru')};
  }).filter(Boolean).sort((a,b)=>a.t-b.t);
}
async function fetchRows(s){
  const r=await fetch(s==='sklenik'?API+'?source=sklenik':API,{headers:{Accept:'application/json'}});
  if(!r.ok)throw new Error('HTTP '+r.status);
  const j=await r.json();
  if(!j.success)throw new Error(j.error||'Chyba při načítání dat');
  if(!Array.isArray(j.data)||!j.data.length)throw new Error('Žádná data v databázi');
  return parse(j.data,s==='sklenik');
}
async function loadData(){
  setMsg('⏳ Načítám data…');
  const res=await Promise.allSettled([fetchRows('meteostanice'),fetchRows('sklenik')]);
  ['meteostanice','sklenik'].forEach((s,i)=>{
    if(res[i].status==='fulfilled'){store[s]=res[i].value;delete errs[s];}else errs[s]=res[i].reason.message;
  });
  render();
}
function setMsg(t,bad){const m=$('msg');m.textContent=t;m.className=bad?'bad':'';m.style.display=t?'block':'none';}

/* ---------- filtry a panely ---------- */
const FILTERS={
  c:{type:'datetime-local',def:'7',opts:[[1,'Poslední den'],[3,'Poslední 3 dny'],[7,'Posledních 7 dní'],[14,'Posledních 14 dní'],[30,'Posledních 30 dní'],['all','Všechna data']]},
  d:{type:'date',def:'30',opts:[[7,'Posledních 7 dní'],[14,'Posledních 14 dní'],[30,'Posledních 30 dní'],[60,'Posledních 60 dní'],[90,'Posledních 90 dní'],['all','Všechna data']]},
  m:{type:'month',def:'12',opts:[[6,'Posledních 6 měsíců'],[12,'Posledních 12 měsíců'],[24,'Posledních 24 měsíců'],['all','Všechna data']]},
  y:{type:'number'}
};
function filters(p){
  const F=FILTERS[p];
  const sel=F.opts?`<label>Období<select id="${p}Range" onchange="refresh('${p}')">${F.opts.map(([v,l])=>`<option value="${v}"${v==F.def?' selected':''}>${l}</option>`).join('')}</select></label>`:'';
  const extra=p==='y'?' min="2020" max="2035" style="width:110px"':'';
  return `<div class="filters">${sel}
    <label>${p==='y'?'Rok od':'Od'}<input id="${p}From" type="${F.type}"${extra} onchange="refresh('${p}')"></label>
    <label>${p==='y'?'Rok do':'Do'}<input id="${p}To" type="${F.type}"${extra} onchange="refresh('${p}')"></label>
    <div class="ml"><button class="ghost" onclick="exportCsv('${p}')">⬇ CSV</button>${p==='c'?'<button class="btn" onclick="loadData()">🔄 Obnovit data</button>':''}</div></div>`;
}
const card=(id,title,sub,cls='')=>`<div class="card ${cls}"><div class="ch"><div><h2>${title}</h2>${sub?`<p>${sub}</p>`:''}</div><button class="ghost" title="Zoom: Ctrl + kolečko, posun: tažení" onclick="charts['${id}']&&charts['${id}'].resetZoom()">↺ Reset zoomu</button></div><div class="cw"><canvas id="${id}"></canvas></div></div>`;
const DAYBOX=`<div class="card" id="dayDetail" style="display:none;margin-bottom:16px"><div class="ch"><div><h2 id="dayTitle"></h2><p>Průběh během dne</p></div><button class="ghost" onclick="document.getElementById('dayDetail').style.display='none'">✕ Zavřít</button></div><div class="kpis" id="dayKpis"></div><div class="cw"><canvas id="dayD"></canvas></div></div>`;
const NAMES={d:'Denní',m:'Měsíční',y:'Roční'};
function periodBody(p){
  const n=NAMES[p];
  return `${p==='d'?DAYBOX:''}<div class="kpis" id="${p}Kpis"></div><div class="grid">
    ${card(p+'T','🌡️ '+n+' teploty','Sloupec = rozsah min–max, čára = průměr')}
    ${card(p+'H','💧 '+n+' vlhkost','Sloupec = rozsah min–max, čára = průměr')}
    ${card(p+'P','🧭 '+n+' tlak vzduchu','Sloupec = rozsah min–max, čára = průměr','meteo-only')}
    ${card(p+'R','🌧️ '+n+' srážky','Sloupce = úhrn, čára = kumulativně za zvolené období','meteo-only')}
  </div><div class="card"><div class="ch"><h2>📋 Přehled hodnot</h2></div><div class="tbl"><table id="${p}Table"></table></div></div>`;
}
function buildPanes(){
  $('pane-c').innerHTML=filters('c')+`<div class="grid">
    ${card('combo','📈 Teplota, rosný bod, vlhkost a tlak','Klik na legendu skryje řadu · Ctrl + kolečko přiblíží · tažením posunete','wide')}
    <div class="wide kpis meteo-only" id="rainKpis" style="margin:0"></div><div class="wide kpis sk-only" id="skKpis" style="margin:0"></div>
    ${card('rain','🌧️ Srážky','Úhrn po hodinách, čára = kumulativně za zvolené období','meteo-only')}
    ${card('batt','🔋 Napětí baterie','Přerušovaná čára = průměr za období')}
    ${card('rbatt','🔋 Napětí baterie srážkoměru','Přerušovaná čára = průměr za období','meteo-only')}
    ${card('dist','📊 Distribuce teplot','Počet měření v jednotlivých teplotních pásmech')}
    ${card('scat','🎯 Teplota vs. vlhkost','Každý bod = jedno měření')}
    ${card('diur','🕒 Průměrný denní chod','Průměr podle hodiny dne za zvolené období, pás = rozsah teploty')}
    <div class="card wide"><div class="ch"><div><h2>🏆 Rekordy</h2><p>Za všechna dostupná data zdroje</p></div></div><div class="kpis" id="records" style="margin:0"></div></div>
    <div class="card wide"><div class="ch"><div><h2>🔀 Srovnání: skleník vs. meteostanice</h2><p>Stejné časové období v obou stanicích</p></div>
      <div class="cmp"><label>Období<select id="cmpRange" onchange="updateCompare()"><option value="1">Poslední den</option><option value="3">Poslední 3 dny</option><option value="7" selected>Posledních 7 dní</option><option value="14">Posledních 14 dní</option><option value="30">Posledních 30 dní</option><option value="all">Všechna data</option></select></label><span class="badge" id="cmpBadge">…</span></div></div>
      <div class="grid" style="margin:0"><div><div class="cw" style="height:300px"><canvas id="cmpT"></canvas></div></div><div><div class="cw" style="height:300px"><canvas id="cmpH"></canvas></div></div></div></div>
    <div class="card wide"><div class="ch"><div><h2>🔥 Roční heatmapa</h2><p id="heatDesc"></p></div>
      <div class="cmp"><label>Rok<select id="heatYear" onchange="updateHeat()"></select></label><label>Veličina<select id="heatMetric" onchange="updateHeat()"></select></label></div></div>
      <div id="heatGrid"></div>
      <div class="hl"><span id="heatMin"></span><i id="heatGrad"></i><span id="heatMax"></span></div></div>
  </div>`;
  ['d','m','y'].forEach(p=>$('pane-'+p).innerHTML=filters(p)+periodBody(p));
  $('heatGrid').addEventListener('click',e=>{const c=e.target.closest('.hcol');if(c)showDay(new Date(+$('heatYear').value,0,1+ +c.dataset.d));});
}

/* ---------- filtrování dat ---------- */
function span(p){
  const a=$(p+'From')?.value,b=$(p+'To')?.value,sel=$(p+'Range')?.value;
  if(p==='y')return [a?new Date(+a,0,1):null,b?new Date(+b,11,31,23,59,59):null];
  const pd=(s,end)=>{
    if(!s)return null;
    if(/^\d{4}-\d{2}$/.test(s)){const [y,m]=s.split('-').map(Number);return end?new Date(y,m,0,23,59,59):new Date(y,m-1,1);}
    if(/^\d{4}-\d{2}-\d{2}$/.test(s))return new Date(s+(end?'T23:59:59':'T00:00:00'));
    return new Date(s);
  };
  let from=pd(a,0),to=pd(b,1);
  if(!from&&!to&&sel&&sel!=='all'){const c=new Date();if(p==='m')c.setMonth(c.getMonth()-+sel);else c.setDate(c.getDate()-+sel);from=c;}
  return [from,to];
}
const inSpan=(data,p)=>{const [a,b]=span(p);return data.filter(d=>(!a||d.t>=a)&&(!b||d.t<=b));};

/* ---------- agregace ---------- */
const PK={
  d:t=>+new Date(t.getFullYear(),t.getMonth(),t.getDate()),
  m:t=>+new Date(t.getFullYear(),t.getMonth(),1),
  y:t=>+new Date(t.getFullYear(),0,1)
};
const lbl=(p,t)=>p==='d'?fd(t,{day:'numeric',month:'numeric',year:'2-digit'}):p==='m'?M3[t.getMonth()]+' '+String(t.getFullYear()).slice(2):String(t.getFullYear());
const lblFull=(p,t)=>p==='d'?fd(t,{weekday:'short',day:'numeric',month:'numeric',year:'numeric'}):p==='m'?MON[t.getMonth()]+' '+t.getFullYear():String(t.getFullYear());
function aggregate(data,p){
  const m=new Map();
  data.forEach(d=>{
    const k=PK[p](d.t);let g=m.get(k);
    if(!g){g={t:new Date(k),T:[],H:[],P:[],R:0};m.set(k,g);}
    g.T.push(d.T);g.H.push(d.H);g.P.push(d.P);g.R+=d.R;
  });
  return [...m.entries()].sort((a,b)=>a[0]-b[0]).map(([,g])=>({
    t:g.t,Ta:avg(g.T),Tn:mn(g.T),Tx:mx(g.T),Ha:avg(g.H),Hn:mn(g.H),Hx:mx(g.H),Pa:avg(g.P),Pn:mn(g.P),Px:mx(g.P),R:g.R

}

/* ---------- heatmapa ---------- */
const HNAME={T:'Teplota',H:'Vlhkost',P:'Tlak',R:'Srážky'},HUNIT={T:'°C',H:'%',P:' hPa',R:' mm'};
const HGRAD={
  T:'linear-gradient(to right,#1a2a4a,#3c5c8c,#6b9bc4,#a8cde3,#f5dc78,#faa04a,#e8583a,#c83028,#8b0000)',
  H:'linear-gradient(to right,rgb(200,220,255),rgb(100,150,255),rgb(50,100,200),rgb(25,40,135))',
  R:'linear-gradient(to right,rgb(200,220,255),rgb(100,150,255),rgb(50,100,200),rgb(25,40,135))',
  P:'linear-gradient(to right,rgb(240,240,240),rgb(180,180,180),rgb(100,100,100),rgb(50,50,50))'
};
function tempColor(t){
  const st=[[-5,[26,56,83],[91,143,185]],[0,[91,143,185],[136,197,221]],[5,[136,197,221],[184,224,168]],[10,[184,224,168],[245,232,125]],[15,[245,232,125],[250,172,61]],[20,[250,172,61],[248,92,60]],[25,[248,92,60],[229,53,44]],[30,[229,53,44],[200,16,16]]];
  if(t<-5)return 'rgb(26,56,83)';if(t>=30)return 'rgb(200,16,16)';
  for(let i=0;i<st.length-1;i++){const [lo,a,b]=st[i];if(t>=lo&&t<lo+5){const r=(t-lo)/5;return `rgb(${a.map((x,j)=>Math.round(x+r*(b[j]-x))).join(',')})`;}}
  return 'rgb(200,16,16)';
}
function heatColor(v,lo,hi,m){
  if(m==='T')return tempColor(v);
  const r=(v-lo)/(hi-lo||1);
  if(m==='P'){const g=Math.round(240-r*190);return `rgb(${g},${g},${g})`;}
  return `rgb(${Math.round(200-r*175)},${Math.round(220-r*180)},${Math.round(255-r*120)})`;
}
function updateHeat(){
  const m=$('heatMetric').value,y=+$('heatYear').value;if(!y||!raw.length)return;
  const leap=(y%4==0&&y%100!=0)||y%400==0,days=leap?366:365,y0=new Date(y,0,1,12);
  const mat=Array.from({length:days},()=>Array.from({length:24},()=>[]));
  raw.forEach(d=>{
    if(d.t.getFullYear()!==y)return;
    const doy=Math.round((new Date(y,d.t.getMonth(),d.t.getDate(),12)-y0)/864e5);
    if(doy>=0&&doy<days)mat[doy][d.t.getHours()].push(d[m]);
  });
  const vals=mat.map(day=>day.map(h=>h.length?(m==='R'?h.reduce((a,b)=>a+b,0):avg(h)):null));
  const all=vals.flat().filter(v=>v!==null);
  $('heatDesc').textContent=(m==='R'?'Součet srážek':'Průměrná '+HNAME[m].toLowerCase())+' podle dne v roce a hodiny · kliknutím na den otevřete jeho detail';
  if(!all.length){$('heatGrid').innerHTML='<p style="color:var(--muted);padding:20px">Nedostatek dat pro zobrazení heatmapy</p>';return;}
  const lo=mn(all),hi=mx(all),u=HUNIT[m];
  $('heatMin').textContent=f(lo)+u;$('heatMax').textContent=f(hi)+u;$('heatGrad').style.background=HGRAD[m];
  const dim=[31,leap?29:28,31,30,31,30,31,31,30,31,30,31];let cum=0;
  const months=M3.map((n,i)=>{const l=(cum+dim[i]/2)/days*100;cum+=dim[i];return `<div class="hml" style="left:${l}%">${n.charAt(0).toUpperCase()+n.slice(1)}</div>`;}).join('');
  const ylab=Array.from({length:24},(_,h)=>`<div class="hyl">${h}:00</div>`).join('');
  const cols=vals.map((day,di)=>{
    const dt=new Date(y,0,1+di);
    return `<div class="hcol" data-d="${di}">${day.map((v,h)=>v===null?'<div class="hc" style="background:var(--line)"></div>':`<div class="hc" style="background:${heatColor(v,lo,hi,m)}" title="${dt.getDate()}. ${dt.getMonth()+1}. ${y} ${h}:00 – ${f(v)}${u}"></div>`).join('')}</div>`;
  }).join('');
  $('heatGrid').innerHTML=`<div class="hgrid"><div class="hy">${ylab}</div><div><div class="hxl">${months}</div><div class="hdata">${cols}</div></div></div>`;
}
function setupHeatControls(){
  const c=CFG[source],ms=$('heatMetric'),prev=ms.value;
  const keys=['T','H'].concat(c.p?['P']:[],c.r?['R']:[]);
  ms.innerHTML=keys.map(k=>`<option value="${k}">${HNAME[k]}</option>`).join('');
  ms.value=keys.includes(prev)?prev:'T';

/* ---------- nové funkce ---------- */
function hourly(d){const m=new Map();d.forEach(r=>{const t=new Date(r.t);t.setMinutes(0,0,0);m.set(+t,(m.get(+t)||0)+r.R);});return [...m].sort((a,b)=>a[0]-b[0]).map(([x,y])=>({x,y:+y.toFixed(2)}));}
function comboChart(id,d,rain){

  const ds_=[line('Teplota',ds(d,'T'),COL.T,{yAxisID:'yT',unit:'°C',dec:1}),line('Rosný bod',ds(d,'D'),'#14b8a6',{yAxisID:'yT',unit:'°C',dec:1,borderDash:[5,4],borderWidth:1.5}),line('Vlhkost',ds(d,'H'),COL.H,{yAxisID:'yH',unit:'%',dec:0})];
  const sc={x:timeX(),yT:{position:'left',title:{display:true,text:'°C',color:COL.T},ticks:{color:COL.T},grid:{color:'rgba(239,68,68,.08)'}},
    yH:{position:'right',min:0,max:100,title:{display:true,text:'%',color:COL.H},ticks:{color:COL.H},grid:{drawOnChartArea:false}}};

function diurnal(d){

  d.forEach(r=>{const h=r.t.getHours();b[h].T.push(r.T);b[h].H.push(r.H);});
  const g=fn=>b.map(x=>x.T.length?fn(x):null);
  const o=opts('',{yT:{position:'left',title:{display:true,text:'°C'}},yH:{position:'right',min:0,max:100,grid:{drawOnChartArea:false},title:{display:true,text:'%'}}});delete o.scales.y;
  o.plugins.legend.labels.filter=i=>i.datasetIndex!==1;
  mk('diur',{type:'line',data:{labels:b.map((_,h)=>h+':00'),datasets:[
    {label:'Teplota max',data:g(x=>mx(x.T)),borderColor:'transparent',backgroundColor:COL.T+'22',pointRadius:0,fill:'+1',yAxisID:'yT',unit:'°C'},
    {label:'Teplota min',data:g(x=>mn(x.T)),borderColor:'transparent',pointRadius:0,fill:false,yAxisID:'yT',unit:'°C'},
    line('Teplota Ø',g(x=>avg(x.T)),COL.T,{yAxisID:'yT',unit:'°C',borderWidth:2.5}),
    line('Vlhkost Ø',g(x=>avg(x.H)),COL.H,{yAxisID:'yH',unit:'%',dec:0})
  ]},options:o});
}
function skStats(d){
  let hot=0,cold=0,day=[],night=[];
  for(let i=1;i<d.length;i++){const dt=Math.min(d[i].t-d[i-1].t,36e5)/36e5;if(d[i].T>=TH.hot)hot+=dt;if(d[i].T<=TH.cold)cold+=dt;}
  d.forEach(r=>{const h=r.t.getHours();(h>=6&&h<20?day:night).push(r.T);});
  const dif=day.length&&night.length?avg(day)-avg(night):null;
  $('skKpis').innerHTML=kp(`Hodin ≥ ${TH.hot} °C`,f(hot)+' h','')+kp(`Hodin ≤ ${TH.cold} °C`,f(cold)+' h','')+kp('Rozdíl den − noc (DIF)',dif==null?'–':(dif>=0?'+':'')+f(dif)+' °C','Ø 6–20 h vs. zbytek dne')+kp('Rosný bod Ø',f(avg(d.map(r=>r.D)))+' °C','za zvolené období');
}
function setTh(){TH.frost=+$('thFrost').value;TH.hot=+$('thHot').value;TH.cold=+$('thCold').value;updateAlerts();if(tab==='c')updateCurrent();}
function updateAlerts(){
  const cur=raw.at(-1),prev=raw.find(r=>r.t>=cur.t-36e5)||cur,tr=cur.T-prev.T,a=[];
  if(cur.T<=0)a.push(['','❄️ Mráz: aktuálně '+f(cur.T)+' °C']);
  else if(cur.T<=TH.frost&&(tr<0||cur.T-cur.D<2))a.push(['warn',`🥶 Riziko mrazu: ${f(cur.T)} °C, ${tr<0?'teplota klesá':'blízko rosného bodu'} (rosný bod ${f(cur.D)} °C)`]);
  if(source==='sklenik'&&cur.T>=TH.hot)a.push(['warn',`🔥 Ve skleníku je ${f(cur.T)} °C – zvažte větrání`]);
  $('alerts').innerHTML=a.map(([c,t])=>`<div class="alert ${c}">${t}</div>`).join('');
}
function updateRecords(){
  const c=CFG[source],at=(a,k,fn)=>a.reduce((x,y)=>fn(y[k],x[k])?y:x),D={day:'numeric',month:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'};
  const hi=at(raw,'T',(a,b)=>a>b),lo=at(raw,'T',(a,b)=>a<b),hh=at(raw,'H',(a,b)=>a>b),hl=at(raw,'H',(a,b)=>a<b);
  let h=kp('🔥 Nejvyšší teplota',f(hi.T)+' °C',fd(hi.t,D))+kp('🧊 Nejnižší teplota',f(lo.T)+' °C',fd(lo.t,D))+kp('💧 Nejvyšší vlhkost',f(hh.H,0)+' %',fd(hh.t,D))+kp('🏜️ Nejnižší vlhkost',f(hl.H,0)+' %',fd(hl.t,D));
  if(c.p){
    const p=raw.filter(r=>r.P>0);
    if(p.length){const ph=at(p,'P',(a,b)=>a>b),pl=at(p,'P',(a,b)=>a<b);h+=kp('🧭 Nejvyšší tlak',f(ph.P,0)+' hPa',fd(ph.t,D))+kp('🧭 Nejnižší tlak',f(pl.P,0)+' hPa',fd(pl.t,D));}
    const wet=at(aggregate(raw,'d'),'R',(a,b)=>a>b),pk=hourly(raw).reduce((a,b)=>b.y>a.y?b:a,{y:0,x:0});
    h+=kp('🌧️ Nejdeštivější den',f(wet.R)+' mm',lblFull('d',wet.t))+kp('⚡ Max. intenzita',f(pk.y)+' mm/h',pk.x?fd(new Date(pk.x),D):'');
  }
  $('records').innerHTML=h;
}
function showDay(dt){
  const d0=new Date(dt.getFullYear(),dt.getMonth(),dt.getDate()),d1=new Date(d0.getFullYear(),d0.getMonth(),d0.getDate()+1),d=raw.filter(r=>r.t>=d0&&r.t<d1);
  if(!d.length)return;
  if(tab!=='d')switchTab('d');
  const T=d.map(r=>r.T),c=CFG[source];
  $('dayTitle').textContent='🔎 Detail dne – '+fd(d0,{weekday:'long',day:'numeric',month:'numeric',year:'numeric'});
  $('dayDetail').style.display='block';
  const ti=T.indexOf(mx(T)),tj=T.indexOf(mn(T));
  $('dayKpis').innerHTML=kp('Nejvyšší teplota',f(mx(T))+' °C',fd(d[ti].t,{hour:'2-digit',minute:'2-digit'}))+kp('Nejnižší teplota',f(mn(T))+' °C',fd(d[tj].t,{hour:'2-digit',minute:'2-digit'}))+kp('Vlhkost Ø',f(avg(d.map(r=>r.H)),0)+' %','')+kp('Rosný bod Ø',f(avg(d.map(r=>r.D)))+' °C','')+(c.r?kp('Srážky',f(d.reduce((a,r)=>a+r.R,0))+' mm',''):'');
  comboChart('dayD',d,true);
  $('dayDetail').scrollIntoView({behavior:'smooth',block:'start'});
}
function exportCsv(p){
  const c=CFG[source],iso=r=>r.t.toLocaleString('sv-SE');
  const cols=p==='c'?[['Datum a čas',iso],['Teplota (°C)',r=>r.T],['Vlhkost (%)',r=>r.H],['Rosný bod (°C)',r=>r.D],...(c.p?[['Tlak (hPa)',r=>r.P]]:[]),['Baterie (V)',r=>r.B],...(c.r?[['Srážky (mm)',r=>r.R],['Baterie srážkoměru (V)',r=>r.RB]]:[])]
   :[[{d:'Den',m:'Měsíc',y:'Rok'}[p],r=>lblFull(p,r.t)],['Teplota Ø (°C)',r=>r.Ta],['Teplota min',r=>r.Tn],['Teplota max',r=>r.Tx],['Vlhkost Ø (%)',r=>r.Ha],['Vlhkost min',r=>r.Hn],['Vlhkost max',r=>r.Hx],...(c.p?[['Tlak Ø (hPa)',r=>r.Pa],['Tlak min',r=>r.Pn],['Tlak max',r=>r.Px]]:[]),...(c.r?[['Srážky (mm)',r=>r.R]]:[])];
  const data=p==='c'?inSpan(raw,'c'):aggregate(inSpan(raw,p),p);
  if(!data.length)return;
  const num=v=>typeof v==='number'?String(+v.toFixed(3)).replace('.',','):v;
  const csv='\ufeff'+[cols.map(x=>x[0]).join(';'),...data.map(r=>cols.map(x=>num(x[1](r))).join(';'))].join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download=`${source}_${{c:'data',d:'denni',m:'mesicni',y:'rocni'}[p]}_${new Date().toISOString().slice(0,10)}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

/* ---------- řízení ---------- */
function refresh(p){p==='c'?updateCurrent():updatePeriod(p);}
function switchTab(t){
  tab=t;
  document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('on','cdmy'[i]===t));
  document.querySelectorAll('.pane').forEach(el=>el.classList.toggle('on',el.id==='pane-'+t));
  refresh(t);
}
function switchSource(s){
  if(s===source)return;
  source=s;const c=CFG[s];
  document.body.classList.toggle('sklenik',s==='sklenik');
  $('title').textContent=c.title;$('subtitle').textContent=c.sub;
  $('bm').classList.toggle('on',s==='meteostanice');$('bs').classList.toggle('on',s==='sklenik');
  Object.values(charts).forEach(ch=>ch&&ch.destroy());charts={};
  render();
}
function render(){
  raw=store[source]||[];
  if(!raw.length){$('app').style.display='none';setMsg('❌ '+(errs[source]||'Žádná data'),true);return;}
  setMsg('');$('app').style.display='block';
  $('last').textContent=`Poslední měření ${fd(raw.at(-1).t,{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'})} · ${raw.length} záznamů · aktualizace každých 15 min`;
  setupHeatControls();updateStats();updateAlerts();updateRecords();refresh(tab);
}

buildPanes();
loadData();
setInterval(loadData,REFRESH);
</script>
</body>
</html>
